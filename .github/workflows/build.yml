name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt dalvik-exchange zipalign apksigner
      - name: Install android-34 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null
      - name: Build
        # No keystore in the repo, so build.sh makes a throwaway one. This APK is for testing only:
        # it can't update a copy signed with your own key.
        run: ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: marquee-launcher-debug
          path: android/build/marquee-launcher-debug.apk

  webos:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: for f in build.sh package.sh install.sh uninstall.sh tv/marquee-autostart; do sh -n "$f"; done
      - name: Build release zip
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: marquee-webos
          path: webos/build/marquee-webos-*.zip
